name: Build GenerelSchwerz llama.cpp (CUDA docker)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch of GenerelSchwerz/llama.cpp to build"
        required: true
        type: choice
        default: moe-cache
        options:
          - moe-cache
          - moe-cache-drafting
          - llama/main
          - llama/dev
          - beellama/main
      cuda_arch:
        description: "CUDA architecture to compile (RTX 3060 = 86; leave default if unsure)"
        required: false
        default: "86"
      extra_tag:
        description: "Optional extra image tag (besides the auto branch tag and :latest)"
        required: false
        default: ""

env:
  IMAGE_REPO: generel-llama.cpp-fork

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this repo (workflow + Dockerfile)
        uses: actions/checkout@v4

      - name: Prepare names (branch slug, lowercase owner, image tags)
        id: prep
        shell: bash
        run: |
          BRANCH="${{ inputs.branch }}"
          SLUG="${BRANCH//\//-}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_REPO}"
          TAGS="${IMAGE}:${SLUG},${IMAGE}:latest"
          if [ -n "${{ inputs.extra_tag }}" ]; then
            TAGS="${TAGS},${IMAGE}:${{ inputs.extra_tag }}"
          fi
          {
            echo "slug=${SLUG}"
            echo "image=${IMAGE}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"
          echo "Tags:  ${TAGS}"

      - name: Clone selected fork branch (always latest HEAD, no cache)
        shell: bash
        run: |
          rm -rf src
          git clone --depth 1 --branch "${{ inputs.branch }}" --single-branch \
            https://github.com/GenerelSchwerz/llama.cpp.git src
          COMMIT="$(git -C src rev-parse --short HEAD)"
          echo "$COMMIT" > src_commit.txt
          echo "Building branch=${{ inputs.branch }} commit=${COMMIT}"

      - name: Copy Dockerfile into build context
        run: cp Dockerfile.generel src/Dockerfile.generel

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile.generel
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            CUDA_ARCH=${{ inputs.cuda_arch }}
            BRANCH=${{ inputs.branch }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Build result"
            echo ""
            echo "- Branch: \`${{ inputs.branch }}\`"
            echo "- Commit: $(cat src_commit.txt)"
            echo "- Image tags: \`${{ steps.prep.outputs.tags }}\`"
            echo "- CUDA arch: \`${{ inputs.cuda_arch }}\`"
            echo ""
            echo "Pull with:"
            echo '```bash'
            echo "docker pull ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.slug }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
